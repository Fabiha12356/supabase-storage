 <div id="parent" class="py-3">

    <!-- Registration Form Section -->
     <div id="form-div">
       <form id="form-valid">

                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example97" name="emailid" class="form-control form-control-lg" 
                  placeholder="Email"/>
                </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                  <input type="password" id="form3Example97" name="password" class="form-control form-control-lg" 
                  placeholder="Password"/>
                </div>

                 <div data-mdb-input-init class="form-outline mb-4">
                  <input type="file" id="form3Example97"  class="form-control form-control-lg" 
                  placeholder="Username"/>
                </div>

                   <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">

                                            <h6 class="mb-0 me-4">Gender: </h6>

                                            <div class="form-check form-check-inline mb-0 me-4">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="femaleGender" value="female" />
                                                <label class="form-check-label" for="femaleGender">Female</label>
                                            </div>

                                            <div class="form-check form-check-inline mb-0 me-4">
                                                <input class="form-check-input" type="radio" name="gender"
                                                    id="maleGender" value="male" />
                                                <label class="form-check-label" for="maleGender">Male</label>
                                            </div>
                                        </div>
                 
       <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-warning btn-lg ms-2">Submit!</button>
       
                
       </form>
                </div>
