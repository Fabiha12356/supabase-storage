<body>

<div class="profile-box">

    <div class="profile-img" id="profile">
        <i class="fa-solid fa-user"></i>
    </div>

    <label for="profile-file" class="edit-btn" id="icon">
        <i class="fa-solid fa-camera" ></i>
        Edit
    </label>

    <input type="file" id="profile-file" accept="image/*">

</div>



  <!-- form -->

  <div id="parent" class="py-3">

    <div class="container-fluid  w-25  h-auto" id="child">

      <!-- Registration Form Section -->
      <div id="form-div">
        <form id="form-valid">

          <div data-mdb-input-init class="form-outline mb-4">
            <input type="text" id="form3Example97" name="emailid" class="form-control form-control-lg"
              placeholder="Email" />
          </div>

          <div data-mdb-input-init class="form-outline mb-4">
            <input type="password" id="form3Example97" name="password" class="form-control form-control-lg"
              placeholder="Password" />
          </div>

          <div data-mdb-input-init class="form-outline mb-4">
            <input type="file" id="pic" class="form-control form-control-lg" placeholder="Username" accept="image/*">
          </div>

          <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">

            <h6 class="mb-0 me-4">Gender: </h6>

            <div class="form-check form-check-inline mb-0 me-4">
              <input class="form-check-input" type="radio" name="gender" id="femaleGender" value="female" />
              <label class="form-check-label" for="femaleGender">Female</label>
            </div>

            <div class="form-check form-check-inline mb-0 me-4">
              <input class="form-check-input" type="radio" name="gender" id="maleGender" value="male" />
              <label class="form-check-label" for="maleGender">Male</label>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <button type="button" data-mdb-button-init data-mdb-ripple-init class="btn  btn-lg ms-2 "
              id="btn">Submit!</button>
          </div>


        </form>
      </div>













      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <!-- <script src="./bootstrap.js"></script> -->

</body>
